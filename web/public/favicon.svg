<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A Bloch sphere: a shaded ball, its equator, and one qubit's state arrow. Readable from 16px.
    Colors copy src/theme.css: the ball runs from the dark theme's primary to a deep blue, and the arrow
    is the dark theme's first accent (amber). No double hyphens in here: XML comments can't hold them.
  -->
  <defs>
    <radialGradient id="ball" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0" style="stop-color: oklch(0.86 0.07 264)" />
      <stop offset="0.45" style="stop-color: oklch(0.6 0.13 264)" />
      <stop offset="1" style="stop-color: oklch(0.3 0.1 264)" />
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="14.5" style="fill: url(#ball)" />
  <ellipse cx="16" cy="16" rx="14.5" ry="4.6" style="fill: none; stroke: oklch(0.96 0.015 264); stroke-width: 1.3; opacity: 0.55" />
  <line x1="16" y1="16" x2="24.2" y2="5.6" style="stroke: oklch(0.2 0.05 264); stroke-width: 4.6; stroke-linecap: round; opacity: 0.35" />
  <line x1="16" y1="16" x2="24.2" y2="5.6" style="stroke: oklch(0.82 0.15 75); stroke-width: 2.8; stroke-linecap: round" />
  <circle cx="24.2" cy="5.6" r="3" style="fill: oklch(0.82 0.15 75); stroke: oklch(0.3 0.1 264); stroke-width: 1" />
  <circle cx="16" cy="16" r="1.5" style="fill: oklch(0.96 0.015 264)" />
</svg>
